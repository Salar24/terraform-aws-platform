name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [envs/dev, envs/prod, bootstrap, modules/platform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [network, eks, database, cache]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform test (mocked AWS provider)
        working-directory: modules/${{ matrix.module }}
        run: |
          terraform init -input=false
          terraform test -verbose 2>&1 | tee test.log
          echo "#### ${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(  run|Success!|Failure!)' test.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned: tags on this action were hijacked in 2026)
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  plan:
    name: Plan ${{ matrix.env }}
    # Runs once the bootstrap roles exist and AWS_PLAN_ROLE_ARN is set as a
    # repository variable. No AWS keys are stored in GitHub: the job exchanges
    # its OIDC token for short-lived credentials.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    needs: [fmt, validate, test, tflint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo "### Plan: ${{ matrix.env }}"; echo '```'; grep -E '^Plan:|No changes' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
